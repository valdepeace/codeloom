[package]
name = "codeloom-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[[bin]]
name = "codeloom"
path = "src/main.rs"

[dependencies]
codeloom-core = { path = "../codeloom-core" }
codeloom-tui = { path = "../codeloom-tui" }
codeloom-herdr = { path = "../codeloom-herdr" }
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
